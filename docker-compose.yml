services:
  editor-client:
    build:
      context: .
      dockerfile: editor_client/Dockerfile
    ports:
      - "8443:8443"
    volumes:
      - ./editor_client:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    restart: unless-stopped

  testing-client:
    build:
      context: .
      dockerfile: testing_client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ACCESS_KEY=${ACCESS_KEY}
    restart: unless-stopped
