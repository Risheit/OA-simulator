services:
  editor-client:
    build:
      context: .
      dockerfile: editor_client/Dockerfile
    ports:
      - "8443:8443"
    volumes:
      - ./editor_client:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/healthz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  testing-client:
    build:
      context: .
      dockerfile: testing_client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ACCESS_KEY=${ACCESS_KEY}
    restart: unless-stopped
    healthcheck:
      test: [
          "CMD",
          "node",
          "-e",
          "const http = require('http');
          http.get('http://localhost:8081/health', (res) => {
          process.exit(res.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1));",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
