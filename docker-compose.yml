services:
  editor-client:
    build:
      context: .
      dockerfile: editor_client/Dockerfile
    ports:
      - "8080:8080"
    user: 1000:1000
    tmpfs: # Keep on top so bind mounts override paths.
      - /home/coder:mode=755,uid=1000,gid=1000
    volumes:
      - ./editor_client/config:/home/coder/.config
      - ./dist/sandbox:/home/coder/project
      - ./dist/.local:/home/coder/.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  testing-client:
    build:
      context: .
      dockerfile: testing_client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ACCESS_KEY=${ACCESS_KEY}
    restart: unless-stopped
    healthcheck:
      test: [
          "CMD",
          "node",
          "-e",
          "const http = require('http');
          http.get('http://localhost:8081/health', (res) => {
          process.exit(res.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1));",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
